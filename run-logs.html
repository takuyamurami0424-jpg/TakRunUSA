<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garmin Running Logs | TakRunUSA</title>
  <style>
    :root { --navy:#2c5282; --ink:#1a202c; --muted:#718096; --line:#e2e8f0; --bg:#f7f9fc; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--bg); }
    header { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:18px 5%; background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
    header a { color:var(--navy); text-decoration:none; font-weight:750; }
    main { width:min(1100px,90%); margin:0 auto; padding:64px 0 80px; }
    .eyebrow { color:var(--navy); font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(2rem,5vw,3rem); }
    .intro { margin:0 0 32px; color:var(--muted); }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
    .metric,.run { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(44,82,130,.07); }
    .metric { padding:20px; }
    .metric strong { display:block; font-size:1.7rem; color:var(--navy); }
    .metric span { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; }
    #logs { display:grid; gap:16px; }
    .run { padding:24px; }
    .run-top { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; }
    .run h2 { margin:0 0 4px; font-size:1.15rem; }
    .date { color:var(--muted); font-size:.88rem; }
    .badge { white-space:nowrap; background:#ebf8ff; color:var(--navy); border-radius:999px; padding:7px 12px; font-size:.78rem; font-weight:750; }
    .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:20px; }
    .stat { padding:12px; background:var(--bg); border-radius:10px; }
    .stat strong { display:block; font-size:1rem; }
    .stat span { color:var(--muted); font-size:.7rem; text-transform:uppercase; }
    .message { text-align:center; padding:50px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:16px; }
    footer { padding:28px; text-align:center; color:var(--muted); border-top:1px solid var(--line); }
    @media(max-width:760px){ main{padding-top:38px}.summary{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.run-top{flex-direction:column}.badge{white-space:normal} }
  </style>
</head>
<body>
  <header>
    <a href="./">TakRunUSA</a>
    <a href="./#works">← Back</a>
  </header>
  <main>
    <div class="eyebrow">Garmin Running Data</div>
    <h1>Running Logs</h1>
    <p class="intro">Automatically updated from Garmin Connect four times per day.</p>
    <section class="summary" aria-label="Running summary">
      <div class="metric"><strong id="run-count">—</strong><span>Recent runs</span></div>
      <div class="metric"><strong id="total-distance">—</strong><span>Total distance</span></div>
      <div class="metric"><strong id="last-updated">—</strong><span>Last updated</span></div>
    </section>
    <section id="logs"><div class="message">Loading Garmin running logs…</div></section>
  </main>
  <footer>© 2026 TakRunUSA | Garmin data is displayed from the site owner's account.</footer>
  <script>
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[char]);

    const formatDate = value => {
      if (!value) return "Date unavailable";
      const normalized = value.includes("T") ? value : value.replace(" ", "T");
      const date = new Date(normalized);
      return Number.isNaN(date.getTime())
        ? value
        : new Intl.DateTimeFormat("en-US", {
            year:"numeric", month:"short", day:"numeric",
            hour:"numeric", minute:"2-digit"
          }).format(date);
    };

    const formatDuration = minutes => {
      if (minutes == null) return "—";
      const total = Math.round(Number(minutes));
      const hours = Math.floor(total / 60);
      const remainder = total % 60;
      return hours ? `${hours}h ${remainder}m` : `${remainder} min`;
    };

    function render(data) {
      const runs = Array.isArray(data.runs) ? data.runs : [];
      document.getElementById("run-count").textContent = runs.length;
      document.getElementById("total-distance").textContent =
        `${runs.reduce((sum, run) => sum + Number(run.distance_km || 0), 0).toFixed(1)} km`;
      document.getElementById("last-updated").textContent =
        data.generated_at ? formatDate(data.generated_at) : "—";

      document.getElementById("logs").innerHTML = runs.length
        ? runs.map(run => `
          <article class="run">
            <div class="run-top">
              <div>
                <h2>${escapeHtml(run.activity_name_en || run.activity_name || "Running")}</h2>
                <div class="date">${escapeHtml(formatDate(run.date))}</div>
              </div>
              <div class="badge">${escapeHtml(run.estimated_run_type || "Running")}</div>
            </div>
            <div class="stats">
              <div class="stat"><strong>${escapeHtml(run.distance_km ?? "—")} km</strong><span>Distance</span></div>
              <div class="stat"><strong>${escapeHtml(formatDuration(run.duration_minutes))}</strong><span>Duration</span></div>
              <div class="stat"><strong>${escapeHtml(run.pace_per_km || "—")}/km</strong><span>Pace</span></div>
              <div class="stat"><strong>${escapeHtml(run.average_hr ?? "—")} bpm</strong><span>Avg HR</span></div>
              <div class="stat"><strong>${escapeHtml(run.elevation_m ?? "—")} m</strong><span>Elevation</span></div>
            </div>
          </article>
        `).join("")
        : '<div class="message">No running logs are available yet.</div>';
    }

    async function loadLogs() {
      try {
        const response = await fetch(`data/run_logs.json?cache=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        try {
          const fallback = await fetch(`data/latest_run.json?cache=${Date.now()}`);
          if (!fallback.ok) throw new Error(`HTTP ${fallback.status}`);
          const latest = await fallback.json();
          render({ generated_at: latest.updated_at, runs: [latest] });
        } catch (fallbackError) {
          document.getElementById("logs").innerHTML =
            '<div class="message">Running logs could not be loaded. Please try again later.</div>';
        }
      }
    }

    loadLogs();
  </script>
</body>
</html>
