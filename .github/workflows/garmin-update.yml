name: Update Garmin Running Data

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/garmin-update.yml"
      - "journey-route.js"
      - "scripts/update_index_journey.py"
      - "scripts/update_run_logs.py"
      - "run-logs.html"

  schedule:
    # 1日4回：米国東部時間のおおよそ
    - cron: "15 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: garmin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get and evaluate Garmin running data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/update_garmin.py

      - name: Update Garmin running history
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/update_run_logs.py

      - name: Update journey page integration
        run: python scripts/update_index_journey.py

      - name: Commit updated running data
        run: |
          git add -- data/latest_run.json data/journey_data.json data/run_logs.json index.html

          if git diff --cached --quiet; then
            echo "No new running data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Garmin running data"
          git push
