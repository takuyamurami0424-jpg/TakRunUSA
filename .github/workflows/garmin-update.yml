name: Update Garmin Running Data

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/garmin-update.yml"
      - "journey-route.js"
      - "dashboard.js"
      - "dashboard.css"
      - "scripts/update_index_journey.py"
      - "scripts/update_run_logs.py"
      - "scripts/update_dashboard.py"
      - "scripts/post_facebook_run.py"
      - "run-logs.html"

  schedule:
    # 1日4回：米国東部時間のおおよそ
    - cron: "15 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: garmin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get and evaluate Garmin running data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/update_garmin.py

      - name: Update Garmin running history
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/update_run_logs.py

      - name: Update Garmin running dashboard
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/update_dashboard.py

      - name: Update journey and dashboard page integration
        run: python scripts/update_index_journey.py

      - name: Commit updated running data
        run: |
          git add -- data/latest_run.json data/journey_data.json data/run_logs.json data/dashboard.json index.html

          if git diff --cached --quiet; then
            echo "No new running data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Garmin running data"

            # 実行中に main が更新されていた場合も、最新変更を取り込んでから保存する
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Post only when the Garmin activity ID differs from the last Facebook-posted activity.
      - name: Post new Garmin run to Facebook Page
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: "1196272093578743"
          FACEBOOK_GRAPH_API_VERSION: "v26.0"
        run: python scripts/post_facebook_run.py
        continue-on-error: true

      - name: Save Facebook posting state
        run: |
          if [ ! -f data/facebook_state.json ]; then
            echo "No Facebook state file."
            exit 0
          fi

          git add -- data/facebook_state.json

          if git diff --cached --quiet; then
            echo "No Facebook posting state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Facebook posting state"
          git pull --rebase origin main
          git push origin HEAD:main
