name: Update Garmin Running Data

on:
  workflow_dispatch:

  schedule:
    # 1日4回：米国東部時間のおおよそ
    - cron: "15 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: garmin-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get and evaluate latest Garmin run
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/update_garmin.py

      - name: Commit updated running data
        run: |
          git add data/latest_run.json

          if git diff --cached --quiet; then
            echo "No new running data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update latest Garmin run"
          git push
